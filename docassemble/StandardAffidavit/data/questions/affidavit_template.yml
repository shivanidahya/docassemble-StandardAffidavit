---
id: Affidavit Details
question: |
  Affidavit Details
subquestion: |
  Please provide the details of the affidavit.
fields:
  - "Details of the affidavit": affidavit_body
  - "Person's full name": full_name
---
id: preview affidavit_template
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.   
  
  ${ al_court_bundle.as_pdf(key='preview') }

  Click the image to open it in a new tab. Click the "Edit answers" button
  to edit your answers.

  ${ action_button_html(url_action('review_affidavit_template'), label='Edit answers', color='info') }
  
  Remember to come back to this window to continue and sign your form.
continue button field: affidavit_template_preview_question    
---
code: |
  signature_fields = []
---
code: |
  # This is a placeholder for the addresses that will be searched
  # for matching address to court. Edit if court venue is based on 
  # a different address than the user's
  [user.address.address for user in users.complete_elements()]
  addresses_to_search = [user.address for user in users.complete_elements()]
---
id: affidavit template review screen
event: review_affidavit_template
question: |
  Review your answers
review:
  - Edit: users.revisit
    button: |
      **Users**

      % for item in users:
        * ${ item }
      % endfor
  - Edit: signature_date
    button: |
      **Date of Signature**:
      ${ signature_date }
  - Edit: affidavit_body
    button: |
      **Under penalty of perjury I, ${ users[0].name.full() }, do swear and affirm the following to be true**:
      ${ affidavit_body }
  - Edit: full_name
    button: |
      **Person's full name**:
      ${ full_name }
---
id: edit users
continue button field: users.revisit
question: |
  Edit users
subquestion: |
  ${ users.table }

  ${ users.add_action() }
---
table: users.table
rows: users
columns:
  - Name: |
      row_item.name_full() if defined("row_item.name.first") else ""
edit:
  - name.first
confirm: True

---
id: download affidavit_template
event: affidavit_template_download
question: |
  All done
subquestion: |
  Thank you ${users}. Your form is ready to download and deliver.
  
  View, download and send your form below. Click the "Edit answers" button to fix any mistakes.

  ${ action_button_html(url_action('review_affidavit_template'), label='Edit answers', color='info') }
  
  
  ${ al_user_bundle.download_list_html() }
  

  ${ al_user_bundle.send_button_html(show_editable_checkbox=True) }

progress: 100
---
# ALDocument objects specify the metadata for each template
objects:
  - affidavit_template_Post_interview_instructions: ALDocument.using(title="Instructions", filename="affidavit_template_next_steps.docx", enabled=True, has_addendum=False)
  - affidavit_template_attachment: ALDocument.using(title="Affidavit template", filename="affidavit_template", enabled=True, has_addendum=False, )
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[affidavit_template_Post_interview_instructions, affidavit_template_attachment], filename="affidavit_template", title="All forms to download for your records", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[affidavit_template_attachment],  filename="affidavit_template", title="All forms to deliver to court", enabled=True)
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the same template is 
# used for "preview" and "final" keys, and logic in the template checks the value of 
# `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: affidavit_template_next_steps
  docx template file: affidavit_template_next_steps.docx
  variable name: affidavit_template_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
---
attachment:
  name: affidavit template
  filename: affidavit_template
  variable name: affidavit_template_attachment[i]
  skip undefined: True
  docx template file: affidavit_template.docx
  tagged pdf: True



